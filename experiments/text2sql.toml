# The text-to-SQL stream: BIRD mini-dev's `financial` questions over one pinned SQLite database. All 32 `financial`
# questions are pinned — 18 in the graded (adaptation) group and 14 in the template-disjoint holdout (verification)
# group — and the pinned database is the full financial.sqlite with every table kept whole, `trans` included, so the
# four trans-reading questions execute and grade like the rest. The lax pool is the graded and holdout families
# together, 32 tasks over the same schema; the stream deals four batches of six sampled by seed from that pool and
# leaves the remaining eight unsampled. The deal balances the two groups round-robin, so each batch is three graded
# and three held-out first sights. Pass k meets batch k at first sight, closes on it, and consolidates every two
# batches. In a stream every batch is unseen, so the holdout's template-disjoint questions arrive as more first sights
# over the same conventions — a real verification set measuring transfer to shapes the graded pool never holds. The
# detached arm meets the same batches with no store; batches 1 and 2 are met again after the stream, which measures
# retention against transfer.
#
# The lesson of this world is the database's own schema: dates are TEXT reached with STRFTIME (no YEAR()), a ratio
# needs CAST(... AS REAL) or SQLite integer-divides to a number that executes and is wrong, statuses and frequencies
# are coded literals, `order` is a reserved word. The evidence in the prompt names the domain mapping, never the
# dialect, so the convention is met on first contact and, once admitted, transfers to an unseen question over the
# same schema. Grading re-executes the returned SELECT and compares rows to the gold's rows — a wrong-but-running
# query fails.
#
# The roles are split: only the forward pass runs on the actor, gpt-oss-120b, the model the role contracts were priced on;
# every other role — consolidator, examiner, adjudicator, blind coder, re-author — runs on a strong teacher. gpt-oss-20b meets
# the same stream under the same teacher as the weaker actor. The strict
# pool holds the 18 graded questions alone (the holdout has no strict twin), two batches of six sampled by seed and
# consolidated every pass, budgeted at the knowing floor of one shell call: only a pass that already knows the schema
# convention stays in budget. The ~0.5 first-sight rate is the hypothesis this run measures (carry-forward item 89).
#
# The model registry (gpt-oss-120b the actor, gpt-oss-20b the weaker actor, deepseek-pro the teacher) and the
# split-roles teacher block come from experiments/_teacher.toml; `hgi experiment models` lists today's ids.
name = "text2sql"
description = "first-sight text-to-SQL on unseen BIRD questions over one schema as the store grows, a strong teacher over the actor"
extends = "_teacher.toml"

[defaults]
model = "gpt-oss-120b"
passes_per_round = 2
concurrency = 2

[defaults.stream]
families = ["text2sql", "text2sql-holdout"]
batch = 6
batches = 4
seed = 0
revisit = [1, 2]

[defaults.stream.faults]
http_fault_fraction = 0.0

[arms.120b-attached]
mode = "attached"
description = "gpt-oss-120b acting, DeepSeek-V4-Pro on every other role"

[arms.120b-detached]
mode = "detached"
description = "the ablation on the same batches: the actor alone, one run is the whole record"

[arms.20b-attached]
model = "gpt-oss-20b"
description = "a weaker actor on the same stream under the same teacher"

# The strict pool: the 18 graded questions at exactly one shell call, so discovering the schema costs a call the budget
# does not hold. Two batches of six sampled by seed from the 18, consolidated after every pass, leaving six unsampled.
# The batch is set here because the arm's stream table only overrides families and count, so without it the batch would
# fall back to the lax default of six anyway, but it is stated for the record next to the batch count.
[arms.120b-strict]
mode = "attached"
passes_per_round = 1
description = "the strict pool: does the store save the schema-discovery call"
[arms.120b-strict.stream]
families = ["text2sql-strict"]
batch = 6
batches = 2

[arms.120b-strict-detached]
mode = "detached"
passes_per_round = 1
description = "the strict pool's ablation"
[arms.120b-strict-detached.stream]
families = ["text2sql-strict"]
batch = 6
batches = 2

# The seeded twins: the same arms started from experiments/seeds/text2sql — the store a mature loop would hold, injected
# before pass 1 — against the unseeded arms above on the same batches. What the injected decisions buy, paired per batch.
[arms.120b-seeded]
mode = "attached"
seed = "text2sql"
description = "gpt-oss-120b from the seed store: the schema and dialect conventions already admitted"

[arms.120b-strict-seeded]
mode = "attached"
passes_per_round = 1
seed = "text2sql"
description = "the strict pool from the seed store: does the injected schema save the discovery call"
[arms.120b-strict-seeded.stream]
families = ["text2sql-strict"]
batch = 6
batches = 2
