# The reasoning-core HARDER stream: the same produce-and-verify method on a harder tier of Reasoning Core's
# regex-following and cfg-generation instances — 24 tasks, twelve of each generator — dealt into six batches of
# four, balanced over the two generators; pass k meets batch k at first sight, closes on it, and consolidates
# every two batches. The detached arm meets the same batches with no store, so the comparison is paired per
# batch. Batches 1 and 2 are met again after the stream by the attached arm, which measures retention against
# transfer.
#
# This mirrors experiments/reasoning-core.toml arm for arm, on the `-hard` families instead. The harder tier
# raises difficulty on both generators — regex level 5 (deeper nesting of capturing and non-capturing groups,
# escaped metacharacter and literal classes, `\B` anchors, and patterns whose whole body is optional) and grammar
# level 3 with a ten-to-sixteen-token required derivation (longer valid members) — so the unaided first-sight
# ceiling sits below the moderate tier's, which is where the strict pool separates. The tier is
# `HARD = Tier(regex_level=5, cfg_level=3, cfg_tokens=(10, 16), …)` (suite/families/_reasoning_core.py); its
# instances are pinned in suite/data/reasoning-core-hard.jsonl (twelve regex, twelve cfg) on seed bases disjoint
# from the moderate tier.
#
# The lesson is the same method: verify a candidate with the checker before answering (`re.fullmatch`; NLTK's
# Earley membership), and pick a candidate the grammar or pattern provably admits. The lax pool budgets one
# call beyond the knowing policy's single verification, so a wrong first candidate may be repaired; the strict
# pool budgets exactly that one call.
#
# The roles are split, as in the moderate run: only the forward pass runs on the actor, a mid-sized open model;
# every other role — consolidator, examiner, adjudicator, blind coder, re-author — runs on a strong teacher, so
# what the store admits is the teacher's reading of the actor's misses. A second actor, gpt-oss-20b, meets the
# same stream under the same teacher; the detached arms are the actor alone.
#
# The seed store experiments/seeds/reasoning-core-hard encodes the harder tier's method decisions — the same
# produce-and-verify method as the moderate seed, with the level-specific facts rewritten for regex level 5 and
# grammar level 3 at the ten-to-sixteen-token window. Its seeded twins are wired below.
#
# The model registry (qwen3-35b the actor, gpt-oss-20b the weaker actor, deepseek-pro the teacher) and the
# split-roles teacher block come from experiments/_teacher.toml, as in the moderate run; `hgi experiment
# models` lists today's ids.
name = "reasoning-core-hard"
description = "first-sight produce-and-verify on a harder tier of unseen regexes and grammars, a strong teacher over a mid-sized actor"
extends = "_teacher.toml"

[defaults]
model = "qwen3-35b"
passes_per_round = 2
concurrency = 4

[defaults.stream]
families = ["reasoning-core-hard"]
batch = 4
batches = 6
seed = 0
revisit = [1, 2]

[defaults.stream.faults]
http_fault_fraction = 0.0

[arms.qwen-attached]
mode = "attached"
description = "Qwen3.6-35B-A3B acting, DeepSeek-V4-Pro on every other role"

[arms.qwen-detached]
mode = "detached"
description = "the ablation on the same batches: the actor alone, one run is the whole record"

[arms.20b-attached]
model = "gpt-oss-20b"
description = "a weaker actor on the same harder stream under the same teacher"

# The strict pool: the same harder instances budgeted at exactly the one verification call, so a wrong first
# candidate cannot be repaired within budget. Only a pass that already produces a member first time — from the
# store's method, or from the model — passes. This is where the harder tier is meant to bite hardest.
[arms.qwen-strict]
mode = "attached"
description = "the strict pool on the harder tier: does the store's method save the repair call"
[arms.qwen-strict.stream]
families = ["reasoning-core-hard-strict"]

[arms.qwen-strict-detached]
mode = "detached"
description = "the harder strict pool's ablation"
[arms.qwen-strict-detached.stream]
families = ["reasoning-core-hard-strict"]

# The seeded twins: the same arms started from experiments/seeds/reasoning-core-hard — the produce-and-verify
# method already admitted, rewritten for the harder tier — against the unseeded arms above on the same batches.
# What the injected method buys, paired per batch.
[arms.qwen-seeded]
mode = "attached"
seed = "reasoning-core-hard"
description = "Qwen3.6-35B-A3B from the harder-tier seed store: the verify-before-answering method already admitted"

[arms.qwen-strict-seeded]
mode = "attached"
seed = "reasoning-core-hard"
description = "the harder strict pool from the seed store: does the injected method save the repair call"
[arms.qwen-strict-seeded.stream]
families = ["reasoning-core-hard-strict"]
