# The run of spec § 14 on a real frozen model: the same model, the same suite hash, the memory
# attached against detached. Six passes, consolidation every two. This is the curve the README
# reports; the stub run it replaces is in the repository store.
#
# The Weave project and the model registry come from experiments/_base.toml; `hgi experiment models`
# lists what the endpoint serves today. The key is $WANDB_API_KEY or the netrc entry `wandb login` wrote.
name = "baseline"
description = "memory attached vs detached, one model, the § 14 run"
extends = "_base.toml"

[defaults]
model = "gpt-oss-120b"
rounds = 3
passes_per_round = 2
concurrency = 4

[arms.attached]
mode = "attached"
description = "boot, evaluate, close every pass; consolidate every two"

[arms.detached]
mode = "detached"
description = "the ablation: same agent, same suite, no boot or close"
